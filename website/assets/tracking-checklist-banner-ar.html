<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: #0b1420;
      font-family: "IBM Plex Sans Arabic", "SF Arabic", "Geeza Pro", Tahoma, Arial, sans-serif;
    }

    .banner {
      position: relative;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(9, 18, 29, 0.18) 0%, rgba(9, 18, 29, 0.22) 42%, rgba(9, 18, 29, 0.88) 71%, rgba(9, 18, 29, 0.97) 100%),
        url("/assets/tracking-checklist-photo-base.png") center / cover no-repeat;
      color: #fff;
    }

    .copy {
      position: absolute;
      top: 104px;
      right: 104px;
      width: 600px;
      text-align: right;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 360px;
      height: 58px;
      padding: 0 34px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: rgba(8, 18, 28, 0.7);
      color: #f7b500;
      font-size: 27px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    h1 {
      margin: 58px 0 0;
      max-width: 590px;
      color: #fff;
      font-size: 72px;
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: 0;
    }

    .lead {
      margin: 30px 0 0;
      max-width: 560px;
      color: rgba(236, 244, 252, 0.94);
      font-size: 36px;
      font-weight: 500;
      line-height: 1.7;
      letter-spacing: 0;
    }

    .benefits {
      display: grid;
      gap: 10px;
      margin-top: 28px;
      width: 505px;
    }

    .benefit {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
      min-height: 44px;
      color: #f8fafc;
      font-size: 32px;
      font-weight: 600;
      line-height: 1.35;
    }

    .check {
      display: inline-grid;
      place-items: center;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #24ad85;
      color: #fff;
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 486px;
      height: 64px;
      margin-top: 24px;
      border-radius: 999px;
      background: #f7b500;
      color: #151b22;
      font-size: 33px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .brand {
      position: absolute;
      left: 92px;
      bottom: 46px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 33px;
      font-weight: 700;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main class="banner" aria-label="بانر قائمة فحص التتبع">
    <section class="copy">
      <div class="eyebrow">قائمة فحص التتبع</div>
      <h1>افحص التتبع قبل تغيير الميزانية</h1>
      <p class="lead">اكتشف الخلل، قارن الأرقام بثقة، واحمِ ميزانية الإعلان.</p>
      <div class="benefits">
        <div class="benefit"><span class="check">✓</span><span>تكشف الخلل أسرع</span></div>
        <div class="benefit"><span class="check">✓</span><span>تقارن الأرقام بثقة</span></div>
        <div class="benefit"><span class="check">✓</span><span>تحمي ميزانية الإعلان</span></div>
      </div>
      <div class="cta">افتح الشيت وابدأ الفحص</div>
    </section>
    <div class="brand">بالعرب</div>
  </main>
</body>
</html>
