<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7faf9;
      font-family: "IBM Plex Sans Arabic", "Arial", "Tahoma", sans-serif;
    }

    .banner {
      position: relative;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background-image: url("tracking-checklist-photo-base.png");
      background-size: cover;
      background-position: center;
    }

    .shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(31, 41, 51, 0.08) 0%, rgba(31, 41, 51, 0.72) 64%, rgba(31, 41, 51, 0.88) 100%),
        linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.06) 100%);
    }

    .panel {
      position: absolute;
      right: 92px;
      top: 118px;
      width: 530px;
      padding: 42px 44px 40px;
      color: #ffffff;
      text-align: right;
    }

    .eyebrow {
      display: inline-block;
      margin: 0 0 20px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      color: #d7f4ef;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.25;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0 0 22px;
      color: #ffffff;
      font-size: 68px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .lead {
      margin: 0 0 28px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 32px;
      font-weight: 500;
      line-height: 1.65;
    }

    .benefits {
      display: grid;
      gap: 12px;
      margin: 0 0 34px;
    }

    .benefit {
      display: flex;
      gap: 12px;
      align-items: center;
      color: #ffffff;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.45;
    }

    .check {
      display: inline-grid;
      width: 34px;
      height: 34px;
      place-items: center;
      flex: 0 0 34px;
      border-radius: 50%;
      background: #d7f4ef;
      color: #1f2933;
      font-size: 23px;
      font-weight: 900;
    }

    .cta {
      display: inline-block;
      padding: 18px 28px;
      border-radius: 10px;
      background: #ffffff;
      color: #1f2933;
      font-size: 28px;
      font-weight: 900;
      line-height: 1.25;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
    }

    .brand {
      position: absolute;
      left: 62px;
      bottom: 48px;
      color: rgba(31, 41, 51, 0.72);
      font-size: 29px;
      font-weight: 900;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main class="banner" aria-label="Tracking Audit Checklist">
    <div class="shade"></div>
    <section class="panel">
      <p class="eyebrow">Tracking Audit Checklist</p>
      <h1>افحص التتبع قبل تغيير الميزانية</h1>
      <p class="lead">اعرف أين يضيع رقم الطلب بين Shopify وGA4 وMeta وGoogle.</p>
      <div class="benefits">
        <div class="benefit"><span class="check">✓</span><span>تكشف الخلل أسرع</span></div>
        <div class="benefit"><span class="check">✓</span><span>تقارن الأرقام بثقة</span></div>
        <div class="benefit"><span class="check">✓</span><span>تحمي ميزانية الإعلان</span></div>
      </div>
      <div class="cta">افتح الشيت وابدأ الفحص</div>
    </section>
    <div class="brand">بالعرب</div>
  </main>
</body>
</html>
